<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="brandTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Badge -->
  <g transform="translate(40, 30)">
    <rect width="180" height="180" rx="42" fill="url(#iconBg)" stroke="#1e293b" stroke-width="4" />
    
    <!-- Audio Wave + Flame / Droplet -->
    <g filter="url(#glow)">
      <!-- Wave -->
      <path 
        d="M 25 90 Q 40 90, 50 70 T 65 110 T 80 50 T 95 125 T 110 65 T 125 105 T 140 75 Q 150 90, 155 90" 
        fill="none" 
        stroke="url(#brandTeal)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
      />
      <!-- Flame contour -->
      <path 
        d="M 95 40 C 82 58, 70 75, 78 95 C 83 107, 92 115, 95 120 C 98 115, 107 107, 112 95 C 120 75, 108 58, 95 40 Z" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="6" 
        stroke-linecap="round"
      />
      <!-- Inner droplet -->
      <path 
        d="M 95 85 C 88 95, 85 102, 88 110 C 90 116, 95 120, 95 120 C 95 120, 100 116, 102 110 C 105 102, 102 95, 95 85 Z" 
        fill="url(#brandTeal)" 
      />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(255, 130)">
    <!-- "FlowVoice" -->
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      FlowVoice
    </text>
    
    <!-- ".ai" Badge -->
    <g transform="translate(365, -58)">
      <rect width="90" height="52" rx="14" fill="#0d9488" fill-opacity="0.2" stroke="#14b8a6" stroke-width="2.5" />
      <text x="45" y="36" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#2dd4bf" text-anchor="middle">
        .AI
      </text>
    </g>

    <!-- Tagline -->
    <text y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      AI VOICE RECEPTIONIST FOR HVAC &amp; PLUMBING
    </text>
  </g>
</svg>
