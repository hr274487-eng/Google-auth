<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Teal to Cyan Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Flame Warm Accent -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.15" />

  <!-- Soundwave + Flame + Droplet Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Audio Waveform Line connecting into Flame & Droplet -->
    <path 
      d="M 80 256 Q 115 256, 130 220 T 160 300 T 195 190 T 225 320 T 256 160 T 290 320 T 320 200 T 355 290 T 385 220 Q 400 256, 432 256" 
      fill="none" 
      stroke="url(#tealGrad)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Stylized Central Flame (HVAC) -->
    <path 
      d="M 256 120 C 230 160, 205 195, 220 240 C 228 262, 245 278, 256 295 C 267 278, 284 262, 292 240 C 307 195, 282 160, 256 120 Z" 
      fill="none" 
      stroke="#38bdf8" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    
    <!-- Stylized Inner Droplet (Plumbing) -->
    <path 
      d="M 256 215 C 242 238, 235 255, 240 272 C 245 288, 256 295, 256 295 C 256 295, 267 288, 272 272 C 277 255, 270 238, 256 215 Z" 
      fill="url(#tealGrad)" 
      opacity="0.9"
    />
  </g>

  <!-- Accent Sparks / Nodes -->
  <circle cx="256" cy="115" r="7" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="80" cy="256" r="6" fill="#14b8a6" />
  <circle cx="432" cy="256" r="6" fill="#06b6d4" />
</svg>
